spring.application.name=web-api

logging.level.root=INFO
logging.level.com.example.demo=DEBUG
logging.file.name=application.log

spring.datasource.url=jdbc:postgresql://${DB_ADDRESS}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


app.default-admin-username=${DEFAULT_ADMIN_USERNAME}
app.default-admin-password=${DEFAULT_ADMIN_PASSWORD}

app.edge-api-key=${EDGE_API_KEY}